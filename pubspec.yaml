name: alrozana_carpentry
description: "نظام إدارة منجرة الروزنة للأعمال الخشبية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.0
  printing: ^5.12.0
  shared_preferences: ^2.2.3
  # --- أضف المكتبات الجديدة هنا ---
  supabase_flutter: ^2.3.1  # المكتبة الأساسية للربط بالخادم
  image_picker: ^1.1.2      # لاختيار الصور من الجهاز
  uuid: ^4.3.3              # لإنشاء أسماء فريدة للصور

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/